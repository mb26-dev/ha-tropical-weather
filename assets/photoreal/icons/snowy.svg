<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Snowy">
  <image href="data:image/webp;base64," width="256" height="256"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-4 -10;5 26" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/>
    <image href="data:image/webp;base64," width="256" height="256"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="4 -10;-5 26" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <image href="data:image/webp;base64," width="256" height="256"/>
  </g>
</svg>
