<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Clear Night">
  <g>
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" repeatCount="indefinite"/>
    <image href="data:image/webp;base64," width="256" height="256"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2 128 128;2 128 128;-2 128 128" dur="7s" repeatCount="indefinite"/>
    <image href="data:image/webp;base64," width="256" height="256"/>
  </g>
</svg>
